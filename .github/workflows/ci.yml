name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --version && shellcheck -x bin/zoom-quiet
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: bash -n bin/zoom-quiet
      - name: plist template
        run: plutil -lint launchd/zoom-quiet.plist.template
      - name: fake meeting loop
        run: |
          T="$RUNNER_TEMP/zq"; mkdir -p "$T/cfg/zoom-quiet"
          cat > "$T/cfg/zoom-quiet/config" <<CFG
          INTERVAL=1
          LEAVE_CHECKS=2
          ON_CMD='echo on >> $T/events'
          OFF_CMD='echo off >> $T/events'
          TEST_FLAG=$T/meeting
          CFG
          export XDG_CONFIG_HOME="$T/cfg" XDG_STATE_HOME="$T/state" LC_ALL=C
          bin/zoom-quiet check && exit 1 || true
          bin/zoom-quiet run & P=$!
          sleep 2; touch "$T/meeting"; sleep 4
          rm "$T/meeting"; sleep 8
          kill $P; wait $P || true
          cat "$T/state/zoom-quiet/zoom-quiet.log"
          test "$(tr '\n' ' ' < "$T/events")" = "on off "
